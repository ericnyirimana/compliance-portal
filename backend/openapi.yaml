info:
  title: BNR Licensing Portal API
  description: National Bank of Rwanda — Licensing & Compliance Portal
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          example: newuser@bnr.test
        password:
          type: string
          example: Password1!
      required:
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: alice@bnr.test
        password:
          type: string
          example: Password1!
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    CreateApplicationDto:
      type: object
      properties:
        bankName:
          type: string
          example: Kigali Commercial Bank Ltd
        licenceType:
          type: string
          enum:
            - COMMERCIAL_BANK
            - MICROFINANCE
            - FOREX_BUREAU
            - PAYMENT_INSTITUTION
        capitalAmount:
          type: number
          example: 5000000000
        address:
          type: string
          example: KG 1 Ave, Kigali, Rwanda
      required:
        - bankName
        - licenceType
        - capitalAmount
    RequestInfoDto:
      type: object
      properties:
        notes:
          type: string
          example: Please provide audited financial statements for the last 3 years.
      required:
        - notes
    RecommendApplicationDto:
      type: object
      properties:
        notes:
          type: string
    DecideApplicationDto:
      type: object
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
        notes:
          type: string
      required:
        - decision
